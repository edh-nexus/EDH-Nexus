<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDH Nexus</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --border-color: #2e3440;
      --accent-color: #7b2cbf;
      --text-main: #f8f9fa;
      --text-muted: #9a9ea7;
      --win-color: #2b9348;
      --loss-color: #d90429;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    h1 { font-size: 1.8rem; letter-spacing: 1px; color: var(--text-main); }

    .controls { display: flex; gap: 12px; flex-wrap: wrap; }
    select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; outline: none; cursor: pointer; }
    select:disabled { opacity: 0.5; cursor: not-allowed; }

    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; }
    
    .art-container { position: relative; width: 100%; height: 260px; border-radius: 8px; overflow: hidden; background-color: #12141c; display: flex; }
    .art-container img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .art-container.has-partner img { width: 50%; }

    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .stat-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }

    .badge-win { color: var(--win-color); font-weight: bold; }
    .badge-loss { color: var(--loss-color); font-weight: bold; }

    #loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <h1>EDH Nexus</h1>
    <div class="controls">
      <select id="playerSelect" onchange="onPlayerChange()">
        <option value="">Select Player...</option>
      </select>
      <select id="deckSelect" disabled onchange="onDeckChange()">
        <option value="">Select Deck...</option>
      </select>
    </div>
  </header>

  <div id="loading">Loading EDH Nexus database...</div>

  <div id="dashboard" class="dashboard-grid" style="display: none;">
    <div class="card">
      <h4 id="commanderCardHeader" style="text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; font-size: 0.85rem;">ACTIVE COMMANDER</h4>
      
      <div class="art-container">
        <img id="commanderArt1" src="" alt="Commander Art 1" />
        <img id="commanderArt2" src="" alt="Commander Art 2" style="display: none;" />
      </div>

      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px;">
        <div>
          <h3 id="commanderName" style="margin: 0; font-size: 1.2rem;"></h3>
          <div id="commanderTheme" style="color: var(--text-muted); font-size: 0.9em; margin-top: 4px;"></div>
        </div>
        <div id="colorIdentityDisplay" style="font-weight: bold; font-size: 0.95rem; letter-spacing: 2px;"></div>
      </div>
    </div>

    <div class="card">
      <h4 style="text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; font-size: 0.85rem;">STATISTICS</h4>
      <div class="stats-grid">
        <div class="stat-box">
          <div style="color: var(--text-muted); font-size: 0.85rem;">TOTAL GAMES</div>
          <div id="totalGames" class="stat-val">0</div>
        </div>
        <div class="stat-box">
          <div style="color: var(--text-muted); font-size: 0.85rem;">RECORD (W / L)</div>
          <div id="winsLosses" class="stat-val">0 / 0</div>
        </div>
        <div class="stat-box">
          <div style="color: var(--text-muted); font-size: 0.85rem;">WIN RATE</div>
          <div id="winRate" class="stat-val" style="color: var(--win-color);">0%</div>
        </div>
        <div class="stat-box">
          <div style="color: var(--text-muted); font-size: 0.85rem;">AVG POSITION</div>
          <div id="avgPos" class="stat-val">N/A</div>
        </div>
      </div>
    </div>
  </div>

  <div id="historyCard" class="card" style="margin-top: 20px; display: none;">
    <h4 style="text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; font-size: 0.85rem;">MATCH HISTORY</h4>
    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
      <thead>
        <tr style="text-align: left; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem;">
          <th style="padding: 8px;">Date</th>
          <th style="padding: 8px;">Commander</th>
          <th style="padding: 8px;">Finish</th>
          <th style="padding: 8px;">Opponents & Decks</th>
        </tr>
      </thead>
      <tbody id="matchHistoryRows"></tbody>
    </table>
  </div>

  <script>
    let rawDecks = [];
    let rawMatches = [];
    let playerProcessedDecks = [];

    // Load static JSON files directly from GitHub Pages repository
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const [decksRes, matchesRes] = await Promise.all([
          fetch('./data/decks.json'),
          fetch('./data/matches.json')
        ]);

        rawDecks = await decksRes.json();
        rawMatches = await matchesRes.json();

        populatePlayerDropdown();
        document.getElementById('loading').innerText = 'Select a player to begin...';
      } catch (err) {
        document.getElementById('loading').innerText = 'Error loading repository JSON files.';
        console.error(err);
      }
    });

    function populatePlayerDropdown() {
      const select = document.getElementById('playerSelect');
      select.innerHTML = '<option value="">Select Player...</option>';
      
      const uniquePlayers = [...new Set(rawDecks.map(d => d.player))];
      uniquePlayers.forEach(player => {
        const opt = document.createElement('option');
        opt.value = player;
        opt.textContent = player;
        select.appendChild(opt);
      });
    }

    async function onPlayerChange() {
      const selectedPlayer = document.getElementById('playerSelect').value;
      const deckSelect = document.getElementById('deckSelect');
      deckSelect.disabled = true;

      if (!selectedPlayer) return;

      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').innerText = `Calculating stats for ${selectedPlayer}...`;
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('historyCard').style.display = 'none';

      playerProcessedDecks = await processPlayerData(selectedPlayer);

      deckSelect.innerHTML = '';
      playerProcessedDecks.forEach((deck, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = deck.label;
        deckSelect.appendChild(opt);
      });

      deckSelect.disabled = false;
      renderDashboard(playerProcessedDecks[0]);
    }

    function onDeckChange() {
      const index = document.getElementById('deckSelect').value;
      if (index !== '' && playerProcessedDecks[index]) {
        renderDashboard(playerProcessedDecks[index]);
      }
    }

    async function processPlayerData(playerName) {
  const targetPlayer = playerName.toLowerCase();
  const playerDecks = rawDecks.filter(d => d.player.toLowerCase() === targetPlayer);

  // Extract matches where player participated
  const playerMatches = rawMatches.map(m => {
    const entry = m.players ? m.players.find(p => p.player.toLowerCase() === targetPlayer) : null;
    if (!entry) return null;
    return {
      gameId: m.gameId,
      date: m.date,
      commander: entry.commander,
      position: entry.position,
      pod: m.players
    };
  }).filter(m => m !== null);

  const processed = playerDecks.map(deck => {
    const c1 = deck.commander1 ? deck.commander1.trim() : '';
    const c2 = deck.commander2 && deck.commander2 !== 'None' ? deck.commander2.trim() : '';
    const hasPartner = c2 !== '';
    const combinedLabel = hasPartner ? `${c1} & ${c2}` : c1;

    // Use cached CDN image URLs directly from decks.json with fallback placeholders
    const art1 = deck.artUrl1 || `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(c1)}&format=image&version=art`;
    const art2 = deck.artUrl2 || (hasPartner ? `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(c2)}&format=image&version=art` : '');

    const deckMatches = playerMatches.filter(m => {
      const logged = m.commander.toLowerCase().trim();
      return logged === c1.toLowerCase() || (hasPartner && logged === c2.toLowerCase()) || logged === combinedLabel.toLowerCase();
    });

    const totalGames = deckMatches.length;
    const wins = deckMatches.filter(m => Number(m.position) === 1).length;
    const winRateNum = totalGames > 0 ? (wins / totalGames) * 100 : 0;

    let posSum = 0;
    deckMatches.forEach(m => posSum += Number(m.position || 0));

    return {
      commander1: c1,
      commander2: c2,
      label: combinedLabel,
      artUrl1: art1,
      artUrl2: art2,
      colorIdentity: deck.colorIdentity || 'C',
      theme: deck.theme || 'N/A',
      totalGames: totalGames,
      wins: wins,
      winRateNum: winRateNum,
      winsLosses: `${wins} / ${totalGames - wins}`,
      winRate: winRateNum.toFixed(1) + '%',
      avgPos: totalGames > 0 ? (posSum / totalGames).toFixed(1) : 'N/A',
      recentMatches: deckMatches.slice(-5).reverse()
    };
  });

  // Sort by Most Played Deck
  const sortedByGames = [...processed].sort((a, b) => {
    if (b.totalGames === a.totalGames) {
      return b.winRateNum - a.winRateNum;
    }
    return b.totalGames - a.totalGames;
  });

  const topDeck = sortedByGames.length > 0 && sortedByGames[0].totalGames > 0 ? sortedByGames[0] : null;

  const overallGames = playerMatches.length;
  const overallWins = playerMatches.filter(m => Number(m.position) === 1).length;
  let overallPosSum = 0;
  playerMatches.forEach(m => overallPosSum += Number(m.position || 0));

  const overallProfile = {
    isOverall: true,
    commander1: topDeck ? topDeck.commander1 : `${playerName}'s Career`,
    commander2: topDeck ? topDeck.commander2 : '',
    label: 'Overall Player Profile',
    artUrl1: topDeck ? topDeck.artUrl1 : 'https://via.placeholder.com/600x350/1e1e24/ffffff?text=No+Games',
    artUrl2: topDeck ? topDeck.artUrl2 : '',
    colorIdentity: topDeck ? topDeck.colorIdentity : 'WUBRG',
    theme: topDeck ? `Most Played Deck (${topDeck.totalGames} Games)` : `${processed.length} Decks`,
    totalGames: overallGames,
    winsLosses: `${overallWins} / ${overallGames - overallWins}`,
    winRate: overallGames > 0 ? ((overallWins / overallGames) * 100).toFixed(1) + '%' : '0%',
    avgPos: overallGames > 0 ? (overallPosSum / overallGames).toFixed(1) : 'N/A',
    recentMatches: playerMatches.slice(-5).reverse()
  };

  return [overallProfile, ...processed];
}

    function renderDashboard(data) {
      const cardHeader = document.getElementById('commanderCardHeader');
      const artContainer = document.querySelector('.art-container');
      const art1 = document.getElementById('commanderArt1');
      const art2 = document.getElementById('commanderArt2');
      const nameElem = document.getElementById('commanderName');
      const themeElem = document.getElementById('commanderTheme');

      if (data.isOverall) {
        cardHeader.innerText = 'MOST PLAYED COMMANDER';
        nameElem.innerText = data.commander1;
        themeElem.innerText = data.theme;
        art1.src = data.artUrl1;

        if (data.commander2) {
          art2.src = data.artUrl2;
          art2.style.display = 'block';
          artContainer.classList.add('has-partner');
        } else {
          art2.style.display = 'none';
          artContainer.classList.remove('has-partner');
        }
      } else {
        cardHeader.innerText = 'ACTIVE COMMANDER';
        themeElem.innerText = data.theme;
        art1.src = data.artUrl1;

        if (data.commander2) {
          art2.src = data.artUrl2;
          art2.style.display = 'block';
          artContainer.classList.add('has-partner');
          nameElem.innerText = `${data.commander1} & ${data.commander2}`;
        } else {
          art2.style.display = 'none';
          artContainer.classList.remove('has-partner');
          nameElem.innerText = data.commander1;
        }
      }

      document.getElementById('colorIdentityDisplay').innerText = data.colorIdentity;
      document.getElementById('totalGames').innerText = data.totalGames;
      document.getElementById('winsLosses').innerText = data.winsLosses;
      document.getElementById('winRate').innerText = data.winRate;
      document.getElementById('avgPos').innerText = data.avgPos;

      const tbody = document.getElementById('matchHistoryRows');
      tbody.innerHTML = '';
      if (!data.recentMatches || data.recentMatches.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted); padding: 12px;">No matches recorded yet.</td></tr>';
      } else {
        data.recentMatches.forEach(m => {
          const row = document.createElement('tr');
          const posClass = m.position == 1 ? 'badge-win' : 'badge-loss';
          const posText = m.position == 1 ? '1st 🏆' : `${m.position}th`;

          // Format opponents in the pod
          const activePlayerName = document.getElementById('playerSelect').value.toLowerCase();
          const opponentsHTML = m.pod
            .filter(p => p.player.toLowerCase() !== activePlayerName)
            .map(p => `<span style="display:inline-block; margin-right: 10px; font-size: 0.85rem;"><strong>${p.position}th:</strong> ${p.player} (<em>${p.commander}</em>)</span>`)
            .join(' ');

          row.innerHTML = `
            <td style="padding: 8px; color: var(--text-muted); font-size: 0.85rem;">${m.date || 'N/A'}</td>
            <td style="padding: 8px; font-weight: bold;">${m.commander}</td>
            <td style="padding: 8px;" class="${posClass}">${posText}</td>
            <td style="padding: 8px; color: var(--text-main);">${opponentsHTML}</td>
          `;
          tbody.appendChild(row);
        });
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('dashboard').style.display = 'grid';
      document.getElementById('historyCard').style.display = 'block';
    }
  </script>
</body>
</html>
