<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDH Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="code.js"></script>
</head>

<body>
  <header>
    <div class="topBtn">
      <button id="backToPlayersBtn" class="btn" onclick="showPlayerSelection()">&larr; Back to Players</button>
      <button id="selectDeckBtn" class="btn btnPrimary" onclick="openDeckModal()">Select Deck</button>
    </div>
  </header>

  <!-- MAIN TABS -->
  <nav class="tabNav">
    <button id="tabBtnPlayers" class="tabBtn active" onclick="switchTab('players')">Players</button>
    <button id="tabBtnLeaderboard" class="tabBtn" onclick="switchTab('leaderboard')">Leaderboard</button>
  </nav>

  <div id="loading">Loading EDH Nexus database...</div>

  <!-- PLAYER SELECTION VIEW -->
  <div id="playerSelectionView" style="display: none;">
    <div id="playerGrid" class="playerGrid"></div>
  </div>

  <!-- PLAYER DASHBOARD -->
  <div id="dashboard" class="dashboardGrid" style="display: none;">
    <div class="profileCard card">
      <div class="cardHeader">
        <h4 id="commanderCardHeader" class="cardHeading">Active Commander</h4>
      </div>
      <div class="cardStatBlock">
        <div id="artContainer" class="artContainer" onclick="togglePartnerStack()">
          <img id="commanderArt1" class="singleArt" alt="Commander Art 1"
            onerror="this.onerror=null; this.src=svgPlaceholder;">
          <img id="commanderArt2" class="stackedCard partnerC2" alt="Commander Art 2" style="display: none;"
            onerror="this.onerror=null; this.src=svgPlaceholder;">
        </div>
        <div class="statsGrid">
          <div class="statBox">
            <div class="statCaption">Total Games</div>
            <div id="totalGames" class="statValue">0</div>
          </div>
          <div class="statBox">
            <div class="statCaption">Record (W / L)</div>
            <div id="winsLosses" class="statValue">0 / 0</div>
          </div>
          <div class="statBox">
            <div class="statCaption">Win Rate</div>
            <div id="winRate" class="statValue statValue--win">0%</div>
          </div>
          <div class="statBox">
            <div class="statCaption">AVG Position</div>
            <div id="avgPos" class="statValue">N/A</div>
          </div>
          <div class="statBox">
            <div class="statCaption">Kills</div>
            <div id="totalKills" class="statValue">0</div>
          </div>
          <div class="statBox">
            <div class="statCaption">First Blood</div>
            <div id="totalFirstBloods" class="statValue statValue--gold">0</div>
          </div>
        </div>
        <div class="identityRow">
          <div id="colorIdentityDisplay"></div>
        </div>
        <div id="decklistLinkWrap" class="decklistLinkWrap" style="display: none;"></div>
      </div>
    </div>
  </div>

  <div id="historyCard" class="card historyCard" style="display: none;">
    <h4 class="cardHeading">Match History</h4>
    <table class="historyTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Commander</th>
          <th>Finish</th>
          <th>Kills</th>
          <th>Opponents &amp; Decks</th>
        </tr>
      </thead>
      <tbody id="matchHistoryRows"></tbody>
    </table>
  </div>

  <!-- HEAD-TO-HEAD (rivalry record vs. every opponent this player has shared a pod with) -->
  <div id="headToHeadCard" class="card historyCard" style="display: none;">
    <h4 class="cardHeading">Head-to-Head</h4>
    <div id="headToHeadList" class="rivalryList"></div>
  </div>

  <!-- LEADERBOARD VIEW -->
  <div id="leaderboardView" style="display: none;">

    <div class="card leaderboard-toolbar">
      <div class="toolbar-group">
        <label class="toolbarLabel" for="entitySelect">Ranking</label>
        <select id="entitySelect" class="toolbarSelect" onchange="setLeaderboardEntity(this.value)">
          <option value="players">Players</option>
          <option value="decks">Decks</option>
        </select>
      </div>

      <div id="sortGroup" class="toolbar-group">
        <label class="toolbarLabel" for="sortSelect">Sort by</label>
        <select id="sortSelect" class="toolbarSelect" onchange="setLeaderboardSort(this.value)">
          <option value="wins">Wins</option>
          <option value="avgPos">Avg Position</option>
          <option value="games">Games Played</option>
          <option value="kills">Kill Count</option>
          <option value="firstBlood">First Blood</option>
        </select>
      </div>

      <div class="toolbar-group">
        <label class="toolbarLabel" for="periodSelect">Period</label>
        <select id="periodSelect" class="toolbarSelect" onchange="setLeaderboardFilter('period', this.value)"></select>
      </div>

      <div class="toolbar-group">
        <label class="toolbarLabel" for="podSizeSelect">Pod size</label>
        <select id="podSizeSelect" class="toolbarSelect" onchange="setLeaderboardFilter('podSize', this.value)">
          <option value="any">Any</option>
          <option value="small">2-3 players</option>
          <option value="4">4 players</option>
          <option value="large">5+ players</option>
        </select>
      </div>

      <button type="button" class="btn" onclick="resetLeaderboardFilters()">Reset</button>
      <div id="filterSummary" class="filterSummary"></div>
    </div>

    <!-- Top three, rendered as podium tiles -->
    <div id="leaderboardPodium" class="card podiumCard"></div>

    <div id="standingsCard" class="card">
      <div class="table-scroll">
        <table class="leaderboardTable">
          <thead>
            <tr id="leaderboardHead"></tr>
          </thead>
          <tbody id="leaderboardRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- DECK PICKER MODAL -->
  <div id="deckModal" class="modalOverlay" style="display: none;">
    <div class="modalContent">
      <div class="modalHeader">
        <h3 id="modalTitle">Select Deck</h3>
        <button class="closeBtn" onclick="closeDeckModal()">&times;</button>
      </div>
      <div class="modalBody">
        <input type="text" id="deckSearchInput" class="searchBar" placeholder="Search Decks" oninput="filterDeckGrid()">
        <div id="deckGrid" class="deckGrid"></div>
      </div>
    </div>
  </div>
</body>

</html>
